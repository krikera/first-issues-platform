name: Question
description: Ask a question about using or contributing to the project
labels: ["type: question"]
body:
  - type: textarea
    id: question
    attributes:
      label: What is your question?
      description: Provide as much detail as possible.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / Commit SHA (optional)
